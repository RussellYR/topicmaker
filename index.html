document.getElementById('tab-draw').onclick=()=>{pageView='draw';render();};document.getElementById('tab-overview').onclick=()=>{pageView='overview';overviewClosed=new Set();render();};
if(deck==='B'){metrics.classList.add('four');metrics.insertAdjacentHTML('beforeend',`<div class="metric"><b>${filteredRemaining(s).length}</b><span>此模式可抽</span></div>`);
const bar=document.createElement('div');bar.className='relation-panel';bar.innerHTML=`<div class="relation-head"><strong>適用關係篩選</strong><span class="overview-meta">目前可抽 ${filteredRemaining(s).length} 題</span></div><div class="relation-options">${[['all','全部題目'],['friend','朋友'],['dating','曖昧'],['couple','情侶']].map(([k,label])=>`<button class="relation-option ${relationMode===k?'selected':''}" data-relation="${k}" ${s.pending.length?'disabled':''} aria-pressed="${relationMode===k}">${label}</button>`).join('')}</div><p class="relation-note">${s.pending.length?'請先完成或放棄本輪才能切換篩選。':'預設全部題目；切換篩選不會清除已選紀錄。'}</p>`;draw.querySelector('.category-track').before(bar);bar.querySelectorAll('[data-relation]').forEach(b=>b.onclick=()=>{relationMode=b.dataset.relation;render();});
if(s.pending.length){draw.querySelectorAll('.question-card').forEach((card,i)=>{const q=map[s.pending[i]];if(q)card.querySelector('.choose').insertAdjacentHTML('beforebegin',`<p class="overview-meta">適用關係：${q.relations.map(r=>relationNames[r]).join('、')}</p>`);});}else if(remaining(s).length&&!filteredRemaining(s).length){const element=draw.querySelector('.start-state');if(element)element.innerHTML='<div class="start-icon">🍁</div><h3>此模式的題目已選完</h3><p>請選其他關係模式或「全部題目」繼續，原本的進度不會改變。</p>';}
}
document.getElementById('overview-status').value=overviewStatus;document.getElementById('overview-category').value=overviewCategory;document.getElementById('overview-search').value=overviewSearch;
document.getElementById('overview-status').onchange=e=>{overviewStatus=e.target.value;renderOverview();};document.getElementById('overview-category').onchange=e=>{overviewCategory=e.target.value;renderOverview();};document.getElementById('overview-search').oninput=e=>{overviewSearch=e.target.value;renderOverview();};
if(deck==='B'){document.getElementById('overview-relation').value=overviewRelation;document.getElementById('overview-relation').onchange=e=>{overviewRelation=e.target.value;renderOverview();};}
document.getElementById('overview-all').onclick=()=>{const visible=listedQuestions(),allOpen=visible.length>0&&visible.every(q=>!overviewClosed.has(q.id));for(const q of visible){if(allOpen)overviewClosed.add(q.id);else overviewClosed.delete(q.id);}renderOverview();};
const footer=app.querySelector('.bottom-bar span');if(footer)footer.textContent=`題庫 ${deck} · 玩家 ${active} 的紀錄只保存在目前瀏覽器；不同題庫／玩家互不干擾。`;const reset=app.querySelector('#resetBtn');if(reset)reset.textContent=`重設題庫 ${deck} 玩家 ${active}`;
renderOverview();
}
  function playerPage(){const s=read(active);if(deck==='B'&&s.pending.length)relationMode=s.pendingFilter||'all';const used=answeredSet(s),left=remaining(s),groups=availableGroups(s),numDraw=Math.min(3,groups.length);let display='';
    if(s.pending.length){display=`<div class="question-grid">${s.pending.map((id,i)=>{const q=map[id],c=categories[q.category];return `<article class="question-card" style="--chip-bg:${c.light};--chip-fg:${c.dark}"><div class="q-top"><span class="q-category">${escape(c.name)}</span><span class="q-index">0${i+1} / 0${s.pending.length}</span></div><div class="q-text">${escape(q.text)}</div><button class="choose" data-choose="${id}">選這一題 →</button></article>`}).join('')}</div><div class="draw-footer"><span>這 ${s.pending.length} 題來自${s.pending.length}個不同大類 · 只能選一題</span><button id="discard">這輪不選，全部放回題庫</button></div>`}
    else if(!left.length){display=`<div class="start-state"><div class="start-icon">🎉</div><h3>所有題目都回答過了！</h3><p>玩家 ${active} 的 ${TOTAL} 題全部完成。可以看看下方的已選題目；若想從頭開始，可以重設這位玩家的進度。</p></div>`}
    else {display=`<div class="start-state"><div class="start-icon">✦</div><h3>${s.answered.length?'準備好下一輪了嗎？':'你的第一輪，從這裡開始'}</h3><p>${numDraw===3?'每輪抽出 3 題，且 3 題分屬不同大類。':`目前只有 ${numDraw} 個大類還有未回答題目，將抽出 ${numDraw} 題。`}選定並確認後，只有該題會離開題庫，其他都能再次抽到。</p><button class="btn" id="drawBtn">✳　隨機抽出 ${numDraw} 題</button></div>`}
    const history=s.answered.map((entry,i)=>{const q=map[entry.id],c=categories[q.category];return `<div class="history-row"><div class="history-content"><div class="history-num">${String(s.answered.length-i).padStart(2,'0')}</div><div><div class="history-title">${escape(q.text)}</div><div class="history-meta">${escape(c.name)} · 已選定，不再抽出</div></div></div><time class="history-date">${entry.at?new Date(entry.at).toLocaleDateString('zh-TW'):''}</time></div>`}).join('');
    const other=active==='1'?'2':'1';
    app.innerHTML=`${header()}<section class="player-head"><div><div class="eyebrow">PERSON ${active.padStart(2,'0')} / YOUR OWN DECK</div><h1>玩家 ${active} 的抽籤桌</h1><p>選擇一題，再二次確認。未選的題目會放回題庫；已選題目不再出現。</p></div><div class="head-actions"><a class="ghost" href="?player=${other}" target="_blank" rel="noopener">另開玩家 ${other} ↗</a></div></section><div class="metrics"><div class="metric"><b>${TOTAL}</b><span>題庫總數</span></div><div class="metric"><b>${used.size}</b><span>已選定題目</span></div><div class="metric"><b>${left.length}</b><span>尚可抽題目</span></div></div><section><div class="section-head"><div><h2>本輪抽題</h2><p>同一輪不重複大類；你可以挑最想聊的一題。</p></div><span class="round-num">抽題第 ${s.rounds}${s.rounds===0?'（尚未開始）':''} 輪</span></div><div class="category-track">${CATEGORIES.map(c=>`<span class="${filteredRemaining(s).some(q=>q.category===c.id)?'':'empty'}">${escape(c.name)} ${filteredRemaining(s).filter(q=>q.category===c.id).length}</span>`).join('')}</div><div class="draw-surface">${display}</div></section><section class="history" id="answered-heading"><div class="section-head"><div><h2>已確認的題目</h2><p>只有玩家 ${active} 確認過的題目才會記錄在這裡，永不重抽。</p></div><span class="round-num">共 ${s.answered.length} 題</span></div><div class="history-shell">${history||'<div class="history-empty">還沒有已選定的題目。完成第一輪後會出現在這裡。</div>'}</div></section><footer class="bottom-bar"><span>此玩家的紀錄只保存在目前瀏覽器 · 與玩家 ${other} 互不影響</span><button class="danger" id="resetBtn">重設玩家 ${active} 進度</button></footer>`;
    decoratePlayer();document.getElementById('drawBtn')?.addEventListener('click',draw);document.getElementById('discard')?.addEventListener('click',discard);document.getElementById('resetBtn')?.addEventListener('click',showReset);document.querySelectorAll('[data-choose]').forEach(b=>b.addEventListener('click',()=>startConfirm(b.dataset.choose)));
  }
  function render(){try{if(!deck)home();else if(active)playerPage();else landing();if(storageWarn)app.insertAdjacentHTML('afterbegin','<div role="status" style="background:#fff2d6;color:#79511c;padding:14px;border-radius:12px;margin-bottom:15px;line-height:1.7">目前裝置禁止儲存網站資料。抽題可暫時使用，但離開頁面後進度可能消失。建議使用 Safari／Chrome 開啟正式網站網址。</div>');}catch(e){app.innerHTML='<div style="padding:24px;background:white;border-radius:14px"><h2>無法載入抽題程式</h2><p>請嘗試使用 Safari 或 Chrome 開啟正式網站網址，不要使用附件預覽。</p></div>';}}
  window.addEventListener('storage',e=>{if(e.key?.startsWith('topic-pick-v1-player-')||e.key?.startsWith('topic-pick-v2-deck-b-player-')){closeModal();render()}});
  window.addEventListener('pageshow',()=>render());
  render();
})();
</script>
</body>
</html>
