    .player-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.player-head h1{font-size:clamp(31px,4.5vw,50px);letter-spacing:-1.5px;line-height:1.2;margin:0 0 13px}.player-head p{margin:0;color:var(--muted);line-height:1.8;font-size:14px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.active-person{background:#dfece4;color:#24644c;border:1px solid #c0d9c7;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 32px}.metric{border:1px solid var(--line);border-radius:18px;background:#fffdf9;padding:18px 20px}.metric b{display:block;font-size:32px;letter-spacing:-1px;margin-bottom:5px}.metric span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:15px}.section-head h2{font-size:22px;letter-spacing:-.5px;margin:0}.section-head p{color:var(--muted);font-size:12px;line-height:1.7;margin:7px 0 0}.round-num{font-size:12px;color:#708179;font-weight:700}.draw-surface{padding:26px;border:1px solid var(--line);border-radius:27px;background:#ffffffba;min-height:360px;box-shadow:var(--shadow)}.start-state{min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.start-icon{width:86px;height:86px;border-radius:29px;background:#e4f0e6;display:grid;place-items:center;font-size:38px;transform:rotate(-5deg);margin-bottom:23px}.start-state h3{font-size:23px;margin:0 0 9px}.start-state p{font-size:14px;line-height:1.9;color:var(--muted);max-width:460px;margin:0 0 24px}.question-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.question-card{position:relative;min-height:267px;border:1px solid #e4e9df;border-radius:20px;padding:23px 20px 18px;background:white;display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .15s}.question-card:hover{transform:translateY(-3px);border-color:#adc2b5;box-shadow:0 11px 23px #163d2911}.q-top{display:flex;align-items:center;justify-content:space-between;gap:6px}.q-category{font-size:11px;font-weight:900;border-radius:99px;padding:7px 11px;background:var(--chip-bg);color:var(--chip-fg)}.q-index{color:#a3aaa2;font-size:11px;font-weight:700}.q-text{font-size:clamp(17px,1.8vw,20px);font-weight:900;line-height:1.62;margin:24px 0 26px;flex:1;letter-spacing:-.3px}.choose{width:100%;border-radius:12px;background:#eef4ef;border:1px solid #d8e6dc;color:var(--green);font-weight:850;padding:13px}.choose:hover{background:var(--green);color:#fff}.draw-footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.draw-footer button{border:none;background:transparent;color:#7d756d;text-decoration:underline;text-underline-offset:4px;padding:8px}.draw-footer button:hover{color:#a04f3b}.history{margin-top:36px}.history-shell{border-radius:23px;border:1px solid var(--line);overflow:hidden;background:#fffdf9}.history-empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}.history-row{padding:16px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #ecede8}.history-row:last-child{border:0}.history-content{display:flex;align-items:flex-start;gap:12px}.history-num{border-radius:12px;background:#e4eee6;color:var(--green);font-size:12px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:800}.history-title{font-weight:800;line-height:1.55}.history-meta{font-size:12px;color:var(--muted);margin-top:4px}.history-date{font-size:12px;color:#879088;white-space:nowrap}.bottom-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid #dee4dc;color:var(--muted);font-size:12px}.danger{border:0;background:transparent;color:#a05750;text-decoration:underline;text-underline-offset:4px;padding:8px}
    .overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#15272096;padding:16px;backdrop-filter:blur(5px)}.modal{width:min(100%,490px);border-radius:25px;background:#fffefa;padding:30px;box-shadow:0 24px 70px #101d1d43}.modal-label{color:var(--green2);font-size:12px;letter-spacing:2px;font-weight:850}.modal h2{font-size:26px;line-height:1.4;margin:11px 0}.modal p{font-size:14px;color:var(--muted);line-height:1.9;margin:0 0 17px}.chosen-preview{background:#eef4ee;border-radius:16px;padding:18px;font-size:20px;font-weight:800;line-height:1.6;margin-bottom:21px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1}.disabled-note{font-size:13px;color:#ad6354;margin-bottom:12px}.category-track{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}.category-track span{border:1px solid #e1e7de;color:#7a857a;background:#fbfcfa;border-radius:30px;padding:7px 11px;font-size:11px}.category-track span.empty{color:#b7bcb5;text-decoration:line-through;background:#f4f4f1}
    [hidden]{display:none!important}
    @media(max-width:760px){.shell{padding:20px 16px 44px}.topbar{margin-bottom:34px}.intro{margin-bottom:29px}.intro h1{letter-spacing:-1px}.dashboard{grid-template-columns:1fr}.player-tile{min-height:0;padding:25px}.topright .tiny-label{display:none}.player-head{flex-direction:column}.metrics{gap:8px}.metric{padding:14px}.metric b{font-size:27px}.metric span{font-size:11px}.draw-surface{padding:15px}.question-grid{grid-template-columns:1fr}.question-card{min-height:0;padding:20px}.q-text{margin:15px 0 24px}.history-date{display:none}.modal{padding:25px}.bottom-bar{align-items:flex-start;flex-direction:column}}

<body>
<div class="shell" id="app" aria-live="polite">
  <header class="topbar"><div class="brand"><span class="logo">✳</span><span>三選一 / 話題抽籤</span></div></header>
  <section class="intro"><div class="eyebrow">雙人獨立題庫</div><h1>每次三題，<br><em>選一題聊聊。</em></h1>
  <p class="sub">如果你目前看到這段訊息，表示這個開啟方式沒有執行網頁程式。這常見於手機 App 的附件預覽或 HTML 檔案預覽。請將網頁放到網站空間，再透過 Safari 或 Chrome 開啟網址使用。</p>
  <p class="sub" style="margin-top:16px">你也可以將 HTML 檔案儲存到「檔案」App，選擇以瀏覽器開啟（如果裝置提供這個選項）。請勿在 ChatGPT 內建檔案預覽中直接操作。</p></section>
</div>
<div id="modal-root"></div>
<script>
(function () {
  'use strict';
  const CATEGORIES = [
    {id:'social',name:'交際情況',light:'#eaf3df',dark:'#466d34',questions:[
      '你不喜歡什麼個性的人？','你喜歡什麼個性的人？','你和朋友通常聊什麼、做什麼？','什麼樣的相處方式會讓你覺得舒服？','你在朋友之間通常扮演什麼角色？例如旅行時會主動規劃還是跟隨大家？']},
    {id:'hobbies',name:'興趣愛好與習慣',light:'#e7eefb',dark:'#4667a6',questions:[
      '喜歡哪些遊戲、動畫、漫畫、電視劇或電影？','有推薦的電視劇嗎？','平常比較常看 Netflix、Disney+ 還是 YouTube？','喜歡什麼影視題材？例如懸疑、科幻、恐怖、喜劇或愛情。','有看 Webtoon 嗎？','喜歡什麼料理或零食？','最喜歡哪間餐廳？','會挑食嗎？','喜歡哪些歌手或音樂曲風？','喜歡唱歌嗎？','最喜歡哪首歌？為什麼？','最近有沒有一直重複播放的歌曲？','假日或休閒時間通常怎麼安排？','有運動習慣嗎？','是夜貓子嗎？','一天大約使用手機多久？','平常會玩手機遊戲嗎？','有什麼好習慣或壞習慣？','有什麼特殊癖好嗎？']},
    {id:'life',name:'生活瑣事',light:'#fff0d8',dark:'#a16a18',questions:[
      '最近有什麼開心或想抱怨的事情？','最近遇到什麼印象深刻的事？','最近有什麼煩惱？','經歷過最尷尬的時刻是什麼？','最後悔的決定是什麼？','到目前為止最美好的時刻是什麼？','人生中有哪些一定要嘗試的事情？','哪個地方帶給你最多回憶？','人生中最快樂的一天是哪天？','最近一次哭是什麼時候？為什麼？','最喜歡哪個學科？為什麼？','喜歡實體上課還是線上上課？','有特別感激或討厭的老師嗎？','想學會什麼技能？','還記得自己最早的記憶嗎？','對某個人的第一印象是什麼？','遇過靈異事件嗎？','最喜歡自己身體的哪個部位？','理想職業是什麼？','希望未來自己的家有多大？','有出國過嗎？','最想去哪個國家？','最喜歡哪個國家？','最難忘的旅遊經驗是什麼？','最喜歡台灣哪個縣市？','覺得自己是感性還是理性的人？','覺得自己是內向還是外向的人？','覺得自己的優點和缺點是什麼？','做過人格測驗嗎？結果是什麼？覺得準確嗎？']},
    {id:'values',name:'價值觀',light:'#f6e7f5',dark:'#98528f',questions:[
      '比較想住城市還是鄉下？','相信世界上有鬼嗎？喜歡鬼屋、鬼片或血腥恐怖片嗎？','有宗教信仰嗎？對宗教有什麼看法？','理想中的未來生活是什麼樣子？例如十年後的自己或從事的工作。','家裡通常怎麼分配家事？','對金錢有什麼看法？例如每月娛樂花費、約會是否 AA 制。','有哪些不能開玩笑的地雷？','有慶祝節日的習慣嗎？','吵架後通常會冷戰還是主動低頭？','相信星座嗎？']},
    {id:'relations',name:'親情與愛情',light:'#ffe9e4',dark:'#a35347',questions:[
      '覺得原生家庭對自己有哪些影響？例如感激、創傷或不滿。','如果可以選擇，還會選擇同樣的父母嗎？','家庭經濟狀況是否影響自己的價值觀？','比較喜歡爸爸還是媽媽？','家裡採取什麼教育方式？例如放任、民主或權威式。','如果有小孩，會怎麼教育？','喜歡小孩嗎？理想中想要幾個？','有兄弟姊妹嗎？','和兄弟姊妹的感情如何？','理想型是什麼樣子？例如外貌、個性、價值觀或經濟條件。','完美的約會場景是什麼？','理想的求婚場景是什麼？例如盛大公開或兩人獨處。','覺得性在感情關係中重要嗎？']},
    {id:'whatif',name:'假設性問題',light:'#e4f1ef',dark:'#347a74',questions:[
      '如果明天就是世界末日，你會做什麼？','有養寵物嗎？是貓派還是狗派？','如果突然有兩千萬元，你會做什麼？','如果能和一位名人共進午餐，會選誰？','如果可以回到過去，想對過去的自己說什麼或做什麼？','如果可以擁有超能力，會選擇什麼？例如隱形、超級力量、控制時間或讀心術。','如果可以許三個願望，會許什麼？','如果可以預先知道未來的一件事，想知道什麼？','如果生命只剩一天，會怎麼度過？']}
  ];
  const questions = CATEGORIES.flatMap(c => c.questions.map((q,i)=>({id:c.id+'-'+String(i+1).padStart(2,'0'),category:c.id,text:q})));
  const map = Object.fromEntries(questions.map(q=>[q.id,q]));
  const categories = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
  const TOTAL=questions.length;
  const app=document.getElementById('app'),modal=document.getElementById('modal-root');
  let active=(new URLSearchParams(location.search)).get('player');
  if (!['1','2'].includes(active)) active=null;
  const KEY=p=>'topic-pick-v1-player-'+p;
  let memoryFallback={};
  let storageWarn=false;
  try { const test='__topic_storage_check__'; localStorage.setItem(test,'ok');localStorage.removeItem(test); } catch(e) {storageWarn=true;}
  const defaults=()=>({answered:[],pending:[],rounds:0,revision:0});
  const read=p=>{try{const raw=JSON.parse((storageWarn?memoryFallback[KEY(p)]:localStorage.getItem(KEY(p)))||'null');if(!raw)return defaults();return {answered:Array.isArray(raw.answered)?raw.answered.filter(x=>x&&map[x.id]):[],pending:Array.isArray(raw.pending)?raw.pending.filter(id=>map[id]):[],rounds:Number.isFinite(raw.rounds)?raw.rounds:0,revision:raw.revision||0};}catch{return defaults();}};
  const save=(p,s)=>{s.revision=Date.now();try{if(storageWarn){memoryFallback[KEY(p)]=JSON.stringify(s);}else{localStorage.setItem(KEY(p),JSON.stringify(s));}}catch(e){storageWarn=true;memoryFallback[KEY(p)]=JSON.stringify(s);}return true;};
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const randomInt=n=>{if(n<=1)return 0; if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);const range=4294967296,limit=range-range%n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n;}return Math.floor(Math.random()*n);};
  const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=randomInt(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;};
  const answeredSet=s=>new Set(s.answered.map(x=>x.id));
  const remaining=s=>questions.filter(q=>!answeredSet(s).has(q.id));
  const availableGroups=s=>CATEGORIES.filter(c=>remaining(s).some(q=>q.category===c.id));
  const metrics=p=>{const s=read(p);return {answered:s.answered.length,remain:TOTAL-s.answered.length,pending:s.pending.length};};
  const logo='<div class="brand"><span class="logo">✳</span><span>三選一 <span style="color:#8c9a90;font-size:12px;font-weight:600">/ 話題抽籤</span></span></div>';
  const header=()=>`<header class="topbar">${logo}<div class="topright">${active?`<span class="active-person">玩家 ${active} 的題庫</span><a class="ghost" href="?">雙人入口</a>`:'<span class="tiny-label">TWO PEOPLE · TWO DECKS</span>'}</div></header>`;
  function landing(){
    const tile=p=>{const m=metrics(p);return `<article class="player-tile" data-big="${p}"><span class="tile-kicker">PERSON ${p.padStart(2,'0')}</span><h2 class="tile-title">玩家 ${p}</h2><p class="tile-desc">單獨記錄、單獨抽籤，另一位玩家的結果不會影響這裡。</p><div class="pill-row"><span class="pill">已選 ${m.answered} 題</span><span class="pill">剩餘 ${m.remain} 題</span>${m.pending?'<span class="pill">有未完成抽題</span>':''}</div><div class="entry-actions"><a class="btn" href="?player=${p}">進入玩家 ${p} →</a><a href="?player=${p}" target="_blank" rel="noopener" class="ghost">在新分頁開啟 ↗</a></div></article>`};
    app.innerHTML=`${header()}<section class="intro"><div class="eyebrow">PICK A QUESTION / START A CONVERSATION</div><h1>每次三題，<br><em>選一題聊聊。</em></h1><p class="sub">從六個不同主題隨機抽出三題，挑一題並再次確認。選中的題目永久退出該玩家的題庫，其餘兩題自動放回。兩人進度完全分開。</p></section><section class="dashboard">${tile('1')}${tile('2')}</section><div class="foot-note"><span class="tag-dot"></span>使用方式：讓兩位玩家各自在同一瀏覽器的不同分頁開啟自己的玩家頁面。進度保存在這台裝置的瀏覽器中，不會自動同步到其他裝置。題庫共 ${TOTAL} 題。</div>`;
  }
  function draw(){const s=read(active);if(s.pending.length)return;const chosenCats=shuffle(availableGroups(s)).slice(0,3);const picked=chosenCats.map(c=>{const pool=remaining(s).filter(q=>q.category===c.id);return pool[randomInt(pool.length)].id;});if(!picked.length)return;s.pending=shuffle(picked);s.rounds++;if(save(active,s))render();}
  function discard(){const s=read(active);if(!s.pending.length)return;s.pending=[];if(save(active,s))render();}
  function startConfirm(id){const s=read(active);if(!s.pending.includes(id))return;const q=map[id];modal.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div class="modal-label">FINAL CONFIRMATION · 二次確認</div><h2 id="confirm-title">確定要回答這一題嗎？</h2><p>確認後，這題會從玩家 ${active} 的未抽題庫移除，以後不再抽到。其餘兩題會放回題庫。</p><div class="chosen-preview">${escape(q.text)}</div><div class="modal-actions"><button class="btn secondary" id="cancelConfirm">再想一下</button><button class="btn" id="commitConfirm">確認選這題 ✓</button></div></div></div>`;document.getElementById('cancelConfirm').onclick=closeModal;document.getElementById('commitConfirm').onclick=()=>commit(id);document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',escListener);document.getElementById('cancelConfirm').focus();}
  function escListener(e){if(e.key==='Escape')closeModal()}
  function closeModal(){modal.innerHTML='';document.removeEventListener('keydown',escListener)}
  function commit(id){const s=read(active);if(!s.pending.includes(id)||s.answered.some(x=>x.id===id)){closeModal();render();return;}s.answered.unshift({id,at:new Date().toISOString()});s.pending=[];if(save(active,s)){closeModal();render();document.getElementById('answered-heading')?.scrollIntoView({behavior:'smooth',block:'start'});}}
  function showReset(){modal.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><div class="modal-label">RESET · 清除進度</div><h2 id="reset-title">重設玩家 ${active} 的全部進度？</h2><p>只會清除玩家 ${active} 的已選題目、待選題目與抽題輪數。<strong>無法復原</strong>，另一位玩家完全不受影響。</p><div class="modal-actions"><button class="btn secondary" id="resetCancel">取消</button><button class="btn" style="background:#ac5e51" id="resetSure">確認全部重設</button></div></div></div>`;document.getElementById('resetCancel').onclick=closeModal;document.getElementById('resetSure').onclick=()=>{if(save(active,defaults())){closeModal();render();}};document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',escListener);}
  function playerPage(){const s=read(active),used=answeredSet(s),left=remaining(s),groups=availableGroups(s),numDraw=Math.min(3,groups.length);let display='';
    if(s.pending.length){display=`<div class="question-grid">${s.pending.map((id,i)=>{const q=map[id],c=categories[q.category];return `<article class="question-card" style="--chip-bg:${c.light};--chip-fg:${c.dark}"><div class="q-top"><span class="q-category">${escape(c.name)}</span><span class="q-index">0${i+1} / 0${s.pending.length}</span></div><div class="q-text">${escape(q.text)}</div><button class="choose" data-choose="${id}">選這一題 →</button></article>`}).join('')}</div><div class="draw-footer"><span>這 ${s.pending.length} 題來自${s.pending.length}個不同大類 · 只能選一題</span><button id="discard">這輪不選，全部放回題庫</button></div>`}
    else if(!left.length){display=`<div class="start-state"><div class="start-icon">🎉</div><h3>所有題目都回答過了！</h3><p>玩家 ${active} 的 ${TOTAL} 題全部完成。可以看看下方的已選題目；若想從頭開始，可以重設這位玩家的進度。</p></div>`}
    else {display=`<div class="start-state"><div class="start-icon">✦</div><h3>${s.answered.length?'準備好下一輪了嗎？':'你的第一輪，從這裡開始'}</h3><p>${numDraw===3?'每輪抽出 3 題，且 3 題分屬不同大類。':`目前只有 ${numDraw} 個大類還有未回答題目，將抽出 ${numDraw} 題。`}選定並確認後，只有該題會離開題庫，其他都能再次抽到。</p><button class="btn" id="drawBtn">✳　隨機抽出 ${numDraw} 題</button></div>`}
    const history=s.answered.map((entry,i)=>{const q=map[entry.id],c=categories[q.category];return `<div class="history-row"><div class="history-content"><div class="history-num">${String(s.answered.length-i).padStart(2,'0')}</div><div><div class="history-title">${escape(q.text)}</div><div class="history-meta">${escape(c.name)} · 已選定，不再抽出</div></div></div><time class="history-date">${entry.at?new Date(entry.at).toLocaleDateString('zh-TW'):''}</time></div>`}).join('');
    const other=active==='1'?'2':'1';
    app.innerHTML=`${header()}<section class="player-head"><div><div class="eyebrow">PERSON ${active.padStart(2,'0')} / YOUR OWN DECK</div><h1>玩家 ${active} 的抽籤桌</h1><p>選擇一題，再二次確認。未選的題目會放回題庫；已選題目不再出現。</p></div><div class="head-actions"><a class="ghost" href="?player=${other}" target="_blank" rel="noopener">另開玩家 ${other} ↗</a></div></section><div class="metrics"><div class="metric"><b>${TOTAL}</b><span>題庫總數</span></div><div class="metric"><b>${used.size}</b><span>已選定題目</span></div><div class="metric"><b>${left.length}</b><span>尚可抽題目</span></div></div><section><div class="section-head"><div><h2>本輪抽題</h2><p>同一輪不重複大類；你可以挑最想聊的一題。</p></div><span class="round-num">抽題第 ${s.rounds}${s.rounds===0?'（尚未開始）':''} 輪</span></div><div class="category-track">${CATEGORIES.map(c=>`<span class="${left.some(q=>q.category===c.id)?'':'empty'}">${escape(c.name)} ${left.filter(q=>q.category===c.id).length}</span>`).join('')}</div><div class="draw-surface">${display}</div></section><section class="history" id="answered-heading"><div class="section-head"><div><h2>已確認的題目</h2><p>只有玩家 ${active} 確認過的題目才會記錄在這裡，永不重抽。</p></div><span class="round-num">共 ${s.answered.length} 題</span></div><div class="history-shell">${history||'<div class="history-empty">還沒有已選定的題目。完成第一輪後會出現在這裡。</div>'}</div></section><footer class="bottom-bar"><span>此玩家的紀錄只保存在目前瀏覽器 · 與玩家 ${other} 互不影響</span><button class="danger" id="resetBtn">重設玩家 ${active} 進度</button></footer>`;
    document.getElementById('drawBtn')?.addEventListener('click',draw);document.getElementById('discard')?.addEventListener('click',discard);document.getElementById('resetBtn')?.addEventListener('click',showReset);document.querySelectorAll('[data-choose]').forEach(b=>b.addEventListener('click',()=>startConfirm(b.dataset.choose)));
  }
  function render(){try{if(active)playerPage();else landing();if(storageWarn)app.insertAdjacentHTML('afterbegin','<div role="status" style="background:#fff2d6;color:#79511c;padding:14px;border-radius:12px;margin-bottom:15px;line-height:1.7">目前裝置禁止儲存網站資料。抽題可暫時使用，但離開頁面後進度可能消失。建議使用 Safari／Chrome 開啟正式網站網址。</div>');}catch(e){app.innerHTML='<div style="padding:24px;background:white;border-radius:14px"><h2>無法載入抽題程式</h2><p>請嘗試使用 Safari 或 Chrome 開啟正式網站網址，不要使用附件預覽。</p></div>';}}
  window.addEventListener('storage',e=>{if(e.key?.startsWith('topic-pick-v1-player-')){closeModal();render()}});
  window.addEventListener('pageshow',()=>render());
  render();
})();
</script>
</body>
</html>
